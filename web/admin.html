<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electrow backend log</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/admin.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Backend log</h1>
        <span class="subtitle">live debug output</span>
      </div>
      <div class="topbar-status">
        <span id="admin-status" class="badge badge-muted">connecting</span>
        <a href="/">Back to editor</a>
      </div>
    </header>

    <main class="grid">
      <section class="panel panel-wide">
        <h2>Log tail</h2>
        <p class="hint">Most recent backend events, newest at the bottom. Snapshot polling is excluded.</p>
        <div class="button-row log-toolbar">
          <button id="btn-refresh">Refresh now</button>
          <label><input id="auto-refresh" type="checkbox" checked> Auto-refresh every second</label>
        </div>
        <pre id="admin-log" class="output log-output">No entries yet.</pre>
      </section>
    </main>
  </body>
</html>
